<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar | Emellyn Cracco</title>
<meta name="description" content="Área restrita do portfólio de Emellyn Cracco.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --rosa:#ff7eb6;
  --rosa-claro:#ffe8f3;
  --magenta:#c2185b;
  --rosa-dourado:#e0a4b4;
  --creme:#fffafc;
  --branco:#fff;
  --tinta:#4a2b39;
  --tinta-suave:#7a5566;
  --raio:22px;
  --seta:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26"><path d="M4 2 L4 20 L8.6 15.7 L11.5 22 L14.8 20.5 L11.9 14.4 L18.2 14.4 Z" fill="%23c2185b" stroke="white" stroke-width="1.3" stroke-linejoin="round"/></svg>') 4 2, auto;
  --toque:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="28" viewBox="0 0 24 28"><path d="M9 2.2c0-1.2 1-2.2 2.2-2.2s2.2 1 2.2 2.2V12h.6c.2-.9 1-1.6 2-1.6s1.8.6 2 1.5c.35-.32.8-.5 1.3-.5 1.1 0 2 .9 2 2v.6c.55.35.9.95.9 1.6v3.5c0 4.2-3.4 7.6-7.6 7.6h-1.6c-2.3 0-4.4-1-5.8-2.8L2.6 18.6c-.7-.9-.5-2.2.4-2.8.8-.6 1.9-.5 2.6.2L9 19V2.2Z" fill="%23c2185b" stroke="white" stroke-width="1.1" stroke-linejoin="round"/></svg>') 11 1, pointer;
}
*{box-sizing:border-box;}
html,body{cursor:var(--seta);}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; font-family:"Jost",sans-serif; font-weight:300; color:var(--tinta);
  background:
    radial-gradient(900px 500px at 15% -10%, #fff1f7 0%, rgba(255,241,247,0) 60%),
    radial-gradient(700px 420px at 100% 0%, #ffeef5 0%, rgba(255,238,245,0) 55%),
    var(--creme);
}
a,button{cursor:var(--toque);}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--magenta); outline-offset:2px; border-radius:8px;}

.cartao{
  width:100%; max-width:390px; background:var(--branco);
  border:1px solid rgba(224,164,180,.45); border-radius:var(--raio);
  padding:38px 32px 32px; box-shadow:0 22px 55px rgba(194,24,91,.14);
}
.marca{font-family:"Playfair Display",serif; font-size:1.5rem; margin:0; text-align:center;}
.marca span{color:var(--rosa);}
.sub{
  text-align:center; margin:6px 0 26px; font-size:.72rem;
  letter-spacing:.2em; text-transform:uppercase; color:var(--tinta-suave);
}
label{display:block; font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--tinta-suave); margin-bottom:6px;}
input{
  width:100%; padding:12px 14px; margin-bottom:16px; border-radius:12px;
  border:1px solid rgba(224,164,180,.6); background:#fffdfe;
  font-family:inherit; font-size:.95rem; color:var(--tinta); cursor:text;
}
input:focus{border-color:var(--rosa);}
.botao{
  width:100%; padding:13px; border:0; border-radius:999px; color:#fff;
  background:linear-gradient(135deg, var(--rosa), var(--magenta));
  font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; font-weight:500;
  box-shadow:0 12px 26px rgba(194,24,91,.26); transition:transform .2s ease;
}
.botao:hover{transform:translateY(-2px);}
.botao[disabled]{opacity:.6; transform:none;}
.linha-extra{margin-top:18px; text-align:center;}
.link{
  background:none; border:0; color:var(--magenta); font-size:.8rem;
  text-decoration:underline; padding:4px;
}
.faixa{
  display:none; margin-bottom:18px; padding:11px 14px; border-radius:12px;
  font-size:.86rem; line-height:1.45;
}
.faixa.erro{display:block; background:#ffe3ec; color:#a3164c; border:1px solid #f4b8cd;}
.faixa.ok{display:block; background:var(--rosa-claro); color:var(--magenta); border:1px solid var(--rosa-dourado);}
.voltar{display:block; text-align:center; margin-top:22px; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--tinta-suave); text-decoration:none;}
.voltar:hover{color:var(--magenta);}
.carregando{text-align:center; color:var(--tinta-suave); font-size:.85rem; padding:40px 0;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>

<main class="cartao" id="cartao" hidden>
  <h1 class="marca">Emellyn <span>Cracco</span></h1>
  <p class="sub">Área restrita</p>

  <p class="faixa" id="aviso" role="status" aria-live="polite"></p>

  <form id="formLogin" novalidate>
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" autocomplete="email" required placeholder="seuemail@email.com">

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" required placeholder="sua senha">

    <button type="submit" class="botao" id="botaoEntrar">Entrar</button>
  </form>

  <p class="linha-extra">
    <button type="button" class="link" id="esqueci">Esqueci minha senha</button>
  </p>

  <a class="voltar" href="/">Voltar para o site</a>
</main>

<p class="carregando" id="carregando">Conferindo se você já está logada...</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../js/banco.js"></script>
<script>
const pegar = (s) => document.querySelector(s);
const aviso = pegar("#aviso");

function mostrarAviso(texto, tipo){
  aviso.textContent = texto;
  aviso.className = "faixa " + (tipo || "erro");
}
function limparAviso(){ aviso.className = "faixa"; aviso.textContent = ""; }

function mostrarCartao(){
  pegar("#carregando").hidden = true;
  pegar("#cartao").hidden = false;
}

/* Se o banco nao carregou, mostra o formulario mesmo assim e avisa. */
if(!window.sb){
  mostrarCartao();
  mostrarAviso("Não consegui falar com o banco agora. Recarregue a página em instantes.", "erro");
} else {
  /* 1. Ja tem sessao aberta? Entao vai direto para o painel. */
  window.sb.auth.getSession().then(({ data }) => {
    if(data && data.session){
      window.location.replace("/admin/");
    } else {
      mostrarCartao();
    }
  }).catch(() => mostrarCartao());
}

/* 2. Entrar */
pegar("#formLogin").addEventListener("submit", async (e) => {
  e.preventDefault();
  limparAviso();
  const email = pegar("#email").value.trim();
  const senha = pegar("#senha").value;

  if(!email || !senha){
    mostrarAviso("Preencha o e-mail e a senha.", "erro");
    return;
  }
  if(!window.sb){
    mostrarAviso("Não consegui falar com o banco agora. Tente de novo em instantes.", "erro");
    return;
  }

  const botao = pegar("#botaoEntrar");
  botao.disabled = true;
  botao.textContent = "Entrando...";

  const { error } = await window.sb.auth.signInWithPassword({ email, password: senha });

  botao.disabled = false;
  botao.textContent = "Entrar";

  if(error){
    /* Nunca mostramos o erro em ingles do servidor. */
    const texto = String(error.message || "").toLowerCase();
    if(texto.includes("email not confirmed")){
      mostrarAviso("Este e-mail ainda não foi confirmado. Procure o e-mail de confirmação do Supabase.", "erro");
    } else {
      mostrarAviso("E-mail ou senha incorretos", "erro");
    }
    return;
  }
  window.location.replace("/admin/");
});

/* 3. Esqueci minha senha */
pegar("#esqueci").addEventListener("click", async () => {
  limparAviso();
  const email = pegar("#email").value.trim();
  if(!email){
    mostrarAviso("Escreva o seu e-mail no campo acima e clique de novo.", "erro");
    pegar("#email").focus();
    return;
  }
  if(!window.sb){
    mostrarAviso("Não consegui falar com o banco agora. Tente de novo em instantes.", "erro");
    return;
  }
  const { error } = await window.sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + "/login/"
  });
  if(error){
    mostrarAviso("Não consegui enviar o e-mail agora. Tente de novo em instantes.", "erro");
    return;
  }
  mostrarAviso("Enviei um e-mail com o link para criar uma senha nova. Olhe a sua caixa de entrada.", "ok");
});
</script>
</body>
</html>
