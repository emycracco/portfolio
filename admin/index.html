<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel | Emellyn Cracco</title>
<meta name="description" content="Painel de administração do portfólio de Emellyn Cracco.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   VISUAL DO PAINEL
   Mesmas cores e mesmos cantos arredondados do portfólio,
   com uma fonte só e tamanhos pequenos, para ler rápido.
   ============================================================ */
:root{
  --rosa:#ff7eb6;
  --rosa-claro:#ffe8f3;
  --magenta:#c2185b;
  --rosa-dourado:#e0a4b4;
  --creme:#fffafc;
  --branco:#ffffff;
  --tinta:#4a2b39;
  --tinta-suave:#7a5566;
  --linha:rgba(224,164,180,.4);
  --raio:18px;
  --raio-p:12px;
  --sombra:0 10px 26px rgba(194,24,91,.08);
  --verde:#1b7a52;
  --verde-claro:#e3f6ed;
  --amarelo:#8a6100;
  --amarelo-claro:#fdf2d8;
  --vermelho:#b3264c;
  --vermelho-claro:#ffe3ec;
  --azul:#2b5f8a;
  --azul-claro:#e4f0f9;
  --menu:230px;
  --seta:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26"><path d="M4 2 L4 20 L8.6 15.7 L11.5 22 L14.8 20.5 L11.9 14.4 L18.2 14.4 Z" fill="%23c2185b" stroke="white" stroke-width="1.3" stroke-linejoin="round"/></svg>') 4 2, auto;
  --toque:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="28" viewBox="0 0 24 28"><path d="M9 2.2c0-1.2 1-2.2 2.2-2.2s2.2 1 2.2 2.2V12h.6c.2-.9 1-1.6 2-1.6s1.8.6 2 1.5c.35-.32.8-.5 1.3-.5 1.1 0 2 .9 2 2v.6c.55.35.9.95.9 1.6v3.5c0 4.2-3.4 7.6-7.6 7.6h-1.6c-2.3 0-4.4-1-5.8-2.8L2.6 18.6c-.7-.9-.5-2.2.4-2.8.8-.6 1.9-.5 2.6.2L9 19V2.2Z" fill="%23c2185b" stroke="white" stroke-width="1.1" stroke-linejoin="round"/></svg>') 11 1, pointer;
}
*{box-sizing:border-box;}
html,body{cursor:var(--seta);}
body{
  margin:0; font-family:"Jost",sans-serif; font-weight:300; font-size:14px;
  color:var(--tinta); background:var(--creme); line-height:1.55;
}
a,button,summary,label[for],.clicavel{cursor:var(--toque);}
input,textarea,select{cursor:text;}
select{cursor:var(--toque);}
a{color:var(--magenta);}
h1,h2,h3,h4{margin:0; font-weight:500; line-height:1.3;}
button{font-family:inherit; font-size:inherit; color:inherit;}
:focus-visible{outline:2px solid var(--magenta); outline-offset:2px; border-radius:8px;}

/* ---------- porta de entrada ---------- */
#verificando{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:var(--creme); color:var(--tinta-suave); z-index:200; font-size:.9rem;
}
#app[hidden]{display:none;}

/* ---------- menu lateral ---------- */
.painel{display:flex; min-height:100vh;}
.menu{
  width:var(--menu); flex:none; background:var(--branco);
  border-right:1px solid var(--linha); display:flex; flex-direction:column;
  position:fixed; inset:0 auto 0 0; z-index:60;
}
.menu-topo{padding:22px 20px 14px;}
.menu-marca{font-size:1rem; font-weight:500; letter-spacing:.01em;}
.menu-marca span{color:var(--rosa);}
.menu-sub{font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--rosa-dourado); margin-top:2px;}
.menu-corpo{flex:1; overflow-y:auto; padding:8px 12px;}
.menu-titulo{
  font-size:.6rem; letter-spacing:.18em; text-transform:uppercase;
  color:var(--rosa-dourado); padding:14px 10px 6px;
}
.menu-item{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:9px 10px; margin-bottom:2px; border:0; border-radius:var(--raio-p);
  background:none; text-align:left; color:var(--tinta-suave); font-size:.88rem;
  transition:background .2s ease, color .2s ease;
}
.menu-item:hover{background:#fff4f8; color:var(--magenta);}
.menu-item[aria-current="true"]{background:var(--rosa-claro); color:var(--magenta); font-weight:500;}
.menu-item svg{width:17px; height:17px; flex:none;}
.menu-pe{border-top:1px solid var(--linha); padding:14px 16px; font-size:.78rem;}
.menu-email{color:var(--tinta-suave); word-break:break-all; margin-bottom:10px; font-size:.75rem;}
.sair{
  width:100%; padding:9px; border:1px solid var(--linha); border-radius:999px;
  background:var(--branco); color:var(--magenta); font-size:.72rem;
  letter-spacing:.12em; text-transform:uppercase;
}
.sair:hover{background:var(--rosa-claro);}

/* ---------- conteúdo ---------- */
.conteudo{flex:1; margin-left:var(--menu); min-width:0;}
.topo{
  display:flex; align-items:center; gap:14px; justify-content:space-between;
  padding:20px 26px 12px;
}
.topo h1{font-size:1.15rem;}
.topo p{margin:2px 0 0; font-size:.78rem; color:var(--tinta-suave);}
.abrir-menu{display:none; width:38px; height:34px; border:1px solid var(--linha); border-radius:10px; background:var(--branco);}
.abrir-menu span{display:block; width:16px; height:1.5px; background:var(--magenta); margin:3px auto;}
.area{padding:0 26px 60px;}

/* ---------- avisos ---------- */
.aviso-falta{
  margin:0 26px 16px; padding:12px 16px; border-radius:var(--raio-p);
  background:var(--amarelo-claro); border:1px solid #f0d9a0; color:var(--amarelo); font-size:.82rem;
}
.aviso-falta b{font-weight:500;}
.recado{
  padding:26px; border:1px dashed var(--linha); border-radius:var(--raio);
  background:var(--branco); color:var(--tinta-suave); text-align:center; font-size:.88rem;
}

/* ---------- cartões e faixas ---------- */
.faixa-numeros{
  display:grid; grid-template-columns:repeat(5,1fr); gap:1px;
  background:var(--linha); border:1px solid var(--linha);
  border-radius:var(--raio); overflow:hidden; margin-bottom:18px;
}
.faixa-numeros.quatro{grid-template-columns:repeat(4,1fr);}
.numero{background:var(--branco); padding:14px 16px;}
.numero b{display:block; font-size:1.35rem; font-weight:500; color:var(--magenta); line-height:1.2;}
.numero small{font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--tinta-suave);}
.numero i{display:block; font-style:normal; font-size:.72rem; color:var(--tinta-suave); margin-top:2px;}

.cartao{
  background:var(--branco); border:1px solid var(--linha);
  border-radius:var(--raio); box-shadow:var(--sombra); margin-bottom:18px;
}
.cartao-topo{
  display:flex; align-items:center; gap:12px; justify-content:space-between;
  flex-wrap:wrap; padding:14px 18px; border-bottom:1px solid var(--linha);
}
.cartao-topo h2{font-size:.95rem;}
.cartao-corpo{padding:18px;}

/* ---------- gráfico ---------- */
.grafico{display:flex; align-items:flex-end; gap:6px; height:150px; padding-top:10px;}
.barra{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; height:100%;}
.barra i{
  display:block; width:100%; border-radius:6px 6px 0 0; font-style:normal;
  background:linear-gradient(180deg, var(--rosa), var(--magenta)); min-height:3px;
}
.barra small{font-size:.6rem; color:var(--tinta-suave); white-space:nowrap;}
.origens{list-style:none; margin:0; padding:0;}
.origens li{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--linha); font-size:.85rem;}
.origens li:last-child{border-bottom:0;}
.origens b{font-weight:500; color:var(--magenta);}
.colunas{display:grid; grid-template-columns:1.7fr 1fr; gap:18px;}

/* ---------- tabelas ---------- */
.rolagem{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:.85rem;}
th{
  text-align:left; font-weight:500; font-size:.64rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--tinta-suave);
  padding:10px 12px; border-bottom:1px solid var(--linha); white-space:nowrap;
}
th.ordenavel{cursor:var(--toque);}
th.ordenavel:hover{color:var(--magenta);}
th .sinal{opacity:.25; margin-left:4px;}
th[aria-sort] .sinal{opacity:1; color:var(--magenta);}
td{padding:10px 12px; border-bottom:1px solid rgba(224,164,180,.25); vertical-align:middle;}
tbody tr:last-child td{border-bottom:0;}
tbody tr.linha-clicavel:hover{background:#fff6fa;}
tbody tr.destacada td:first-child{box-shadow:inset 3px 0 0 var(--rosa);}
.vazio-tabela{padding:26px; text-align:center; color:var(--tinta-suave); font-size:.86rem;}
.sumido{opacity:.45;}

/* ---------- pílulas ---------- */
.pilula{
  display:inline-block; padding:3px 10px; border-radius:999px;
  font-size:.68rem; letter-spacing:.06em; white-space:nowrap;
}
.p-lead{background:var(--azul-claro); color:var(--azul);}
.p-conversando{background:var(--amarelo-claro); color:var(--amarelo);}
.p-cliente{background:var(--verde-claro); color:var(--verde);}
.p-parada{background:#efe9ec; color:var(--tinta-suave);}
.p-conteudo{background:var(--rosa-claro); color:var(--magenta);}
.p-publicidade{background:#ece4f6; color:#5b3a86;}
.p-pago{background:var(--verde-claro); color:var(--verde);}
.p-pendente{background:var(--amarelo-claro); color:var(--amarelo);}
.p-atrasado{background:var(--vermelho-claro); color:var(--vermelho);}
.p-perto{background:var(--amarelo-claro); color:var(--amarelo);}
.p-funil{background:var(--rosa-claro); color:var(--magenta);}
.p-gravar{background:var(--rosa-claro); color:var(--magenta);}
.p-editar{background:var(--azul-claro); color:var(--azul);}
.p-postar{background:var(--verde-claro); color:var(--verde);}
.p-prazo{background:#f3e8ee; color:#7a3d5c;}

/* ---------- botões ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 16px;
  border:1px solid transparent; border-radius:999px; font-size:.76rem;
  letter-spacing:.08em; background:var(--branco); color:var(--tinta-suave);
  transition:transform .18s ease;
}
.btn svg{width:15px; height:15px;}
.btn:hover{transform:translateY(-1px);}
.btn-principal{background:linear-gradient(135deg, var(--rosa), var(--magenta)); color:#fff; box-shadow:0 8px 18px rgba(194,24,91,.22);}
.btn-simples{border-color:var(--linha); color:var(--magenta);}
.btn-simples:hover{background:var(--rosa-claro);}
.btn-mini{padding:5px 10px; font-size:.72rem; border-radius:999px; border:1px solid var(--linha); background:var(--branco); color:var(--tinta-suave);}
.btn-mini:hover{color:var(--magenta); border-color:var(--rosa);}
.icone-btn{
  width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--linha); border-radius:9px; background:var(--branco); color:var(--tinta-suave);
}
.icone-btn:hover{color:var(--magenta); border-color:var(--rosa);}
.icone-btn svg{width:15px; height:15px;}
.alcinha{color:var(--rosa-dourado); cursor:grab;}
.alcinha:active{cursor:grabbing;}

/* ---------- filtros e busca ---------- */
.ferramentas{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
.busca{
  display:flex; align-items:center; gap:8px; padding:7px 12px;
  border:1px solid var(--linha); border-radius:999px; background:var(--branco);
}
.busca input{border:0; background:none; font-family:inherit; font-size:.84rem; color:var(--tinta); width:170px;}
.busca input:focus{outline:none;}
.busca svg{width:14px; height:14px; color:var(--rosa-dourado);}
.grupo-filtro{display:flex; gap:6px; flex-wrap:wrap;}
.filtro{
  padding:6px 13px; border:1px solid var(--linha); border-radius:999px;
  background:var(--branco); color:var(--tinta-suave); font-size:.73rem;
}
.filtro:hover{color:var(--magenta); border-color:var(--rosa);}
.filtro[aria-pressed="true"]{background:var(--rosa-claro); color:var(--magenta); border-color:var(--rosa-dourado); font-weight:500;}

/* ---------- calendário ---------- */
.mes-topo{display:flex; align-items:center; gap:10px;}
.mes-nome{font-size:.95rem; min-width:160px; text-align:center; text-transform:capitalize;}
.grade{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--linha); border:1px solid var(--linha); border-radius:var(--raio-p); overflow:hidden;}
.grade .cabeca{background:#fff7fa; padding:8px 6px; text-align:center; font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--tinta-suave);}
.dia{background:var(--branco); min-height:104px; padding:6px 7px; position:relative;}
.dia.fora{background:#fdf8fa; color:var(--rosa-dourado);}
.dia.fora .num{opacity:.5;}
.dia.hoje{box-shadow:inset 0 0 0 2px var(--rosa);}
.dia .num{font-size:.75rem; color:var(--tinta-suave);}
.dia.hoje .num{color:var(--magenta); font-weight:600;}
.dia .mais-dia{
  position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%;
  border:1px solid var(--linha); background:var(--branco); color:var(--magenta);
  line-height:1; font-size:.8rem; opacity:0; transition:opacity .15s ease;
}
.dia:hover .mais-dia{opacity:1;}
.evento{
  display:block; width:100%; text-align:left; border:0; border-radius:7px;
  padding:3px 6px; margin-top:3px; font-size:.68rem; line-height:1.25;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.evento.feito{text-decoration:line-through; opacity:.55;}
.mais-itens{display:block; width:100%; border:0; background:none; color:var(--magenta); font-size:.66rem; text-align:left; padding:3px 6px;}
.atrasados li{display:flex; justify-content:space-between; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid var(--linha); font-size:.85rem;}
.atrasados{list-style:none; margin:0; padding:0;}
.atrasados li:last-child{border-bottom:0;}

/* ---------- checklist ---------- */
.subabas{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.subaba{
  padding:8px 15px; border:1px solid var(--linha); border-radius:999px;
  background:var(--branco); color:var(--tinta-suave); font-size:.78rem;
}
.subaba[aria-pressed="true"]{background:var(--rosa-claro); color:var(--magenta); border-color:var(--rosa-dourado); font-weight:500;}
.progresso{height:6px; border-radius:999px; background:var(--rosa-claro); overflow:hidden;}
.progresso i{display:block; height:100%; background:linear-gradient(90deg, var(--rosa), var(--magenta)); border-radius:999px;}
.secao-check{border:1px solid var(--linha); border-radius:var(--raio); background:var(--branco); margin-bottom:12px; overflow:hidden;}
.secao-topo{display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; border:0; background:none; text-align:left;}
.secao-topo h3{font-size:.92rem;}
.secao-topo small{display:block; color:var(--tinta-suave); font-size:.76rem; font-weight:300;}
.secao-topo .barra-mini{width:90px; flex:none;}
.secao-corpo{padding:0 16px 16px; border-top:1px solid var(--linha);}
.porque{background:var(--rosa-claro); border-radius:var(--raio-p); padding:11px 14px; margin:14px 0; font-size:.83rem; color:var(--magenta);}
.item-check{display:flex; gap:11px; padding:9px 0; border-bottom:1px solid rgba(224,164,180,.25);}
.item-check:last-child{border-bottom:0;}
.item-check input{margin-top:3px; width:16px; height:16px; accent-color:var(--magenta); cursor:var(--toque);}
.item-check b{display:block; font-weight:400; font-size:.88rem;}
.item-check small{color:var(--tinta-suave); font-size:.79rem;}
.item-check.pronto b{text-decoration:line-through; color:var(--tinta-suave);}

.cartoes-ref{display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:16px;}
.ref{border:1px solid var(--linha); border-radius:var(--raio); overflow:hidden; background:var(--branco); text-align:left; padding:0;}
.ref:hover{box-shadow:var(--sombra); transform:translateY(-2px);}
.ref-capa{aspect-ratio:9/16; display:flex; align-items:center; justify-content:center; font-size:2.4rem;}
.ref-info{padding:11px 13px;}
.ref-info b{display:block; font-weight:500; font-size:.85rem; margin-bottom:4px;}
.ref-info small{color:var(--tinta-suave); font-size:.74rem;}
.bloco-tempo{display:flex; gap:12px; padding:9px 0; border-bottom:1px solid rgba(224,164,180,.25);}
.bloco-tempo:last-child{border-bottom:0;}
.bloco-tempo .tempo{flex:none; width:64px; font-size:.72rem; color:var(--magenta); padding-top:2px;}
.bloco-tempo .texto{font-size:.85rem;}
.lista-simples{margin:8px 0 0; padding-left:18px; font-size:.85rem; color:var(--tinta-suave);}
.ideia{border-bottom:1px solid rgba(224,164,180,.25); padding:10px 0;}
.ideia:last-child{border-bottom:0;}
.ideia b{display:block; font-weight:400; font-size:.88rem;}
.ideia small{color:var(--magenta); font-size:.8rem;}
textarea.roteiro{
  width:100%; min-height:190px; padding:13px; border-radius:var(--raio-p);
  border:1px solid var(--linha); background:#fffdfe; font-family:inherit; font-size:.88rem; color:var(--tinta); resize:vertical;
}

/* ---------- janelas ---------- */
.fundo{
  position:fixed; inset:0; background:rgba(74,43,57,.45); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; padding:20px; z-index:120;
}
.fundo.aberto{display:flex;}
.janela{
  width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
  background:var(--branco); border-radius:var(--raio); box-shadow:0 26px 60px rgba(74,43,57,.3);
}
.janela.larga{max-width:680px;}
.janela-topo{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid var(--linha); position:sticky; top:0; background:var(--branco); z-index:2;}
.janela-topo h2{font-size:.98rem;}
.janela-corpo{padding:20px;}
.fechar-janela{width:30px; height:30px; border:1px solid var(--linha); border-radius:50%; background:var(--branco); color:var(--magenta); line-height:1;}
.campos{display:grid; grid-template-columns:1fr 1fr; gap:13px;}
.campo{display:flex; flex-direction:column; gap:5px;}
.campo.largo{grid-column:1 / -1;}
.campo label{font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--tinta-suave);}
.campo input, .campo select, .campo textarea{
  padding:9px 11px; border:1px solid var(--linha); border-radius:10px;
  background:#fffdfe; font-family:inherit; font-size:.88rem; color:var(--tinta);
}
.campo textarea{min-height:76px; resize:vertical;}
.acoes-janela{display:flex; gap:10px; justify-content:flex-end; margin-top:20px; flex-wrap:wrap;}
.apagar{margin-right:auto; color:var(--vermelho); border-color:#f0c2d1;}

/* ---------- recado flutuante ---------- */
#recados{position:fixed; right:18px; bottom:18px; z-index:160; display:flex; flex-direction:column; gap:8px;}
.recado-flutua{
  background:var(--branco); border:1px solid var(--linha); border-left:3px solid var(--rosa);
  border-radius:var(--raio-p); padding:11px 16px; font-size:.83rem; box-shadow:var(--sombra); max-width:300px;
}
.recado-flutua.ruim{border-left-color:var(--vermelho); color:var(--vermelho);}

/* ---------- celular ---------- */
.tapa-menu{display:none; position:fixed; inset:0; background:rgba(74,43,57,.4); z-index:55;}
@media (max-width:900px){
  .colunas{grid-template-columns:1fr;}
  .faixa-numeros, .faixa-numeros.quatro{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:760px){
  .menu{transform:translateX(-100%); transition:transform .25s ease; box-shadow:0 0 40px rgba(74,43,57,.2);}
  .menu.aberto{transform:translateX(0);}
  .conteudo{margin-left:0;}
  .abrir-menu{display:block;}
  .tapa-menu.aberto{display:block;}
  .topo, .area, .aviso-falta{padding-left:16px; padding-right:16px;}
  .campos{grid-template-columns:1fr;}
  .dia{min-height:76px;}
  .evento{font-size:.62rem;}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important;}
}
</style>
</head>
<body>

<div id="verificando">Conferindo o seu acesso...</div>

<div id="app" hidden>
  <div class="tapa-menu" id="tapaMenu"></div>
  <div class="painel">

    <!-- ---------------- MENU ---------------- -->
    <nav class="menu" id="menuLateral" aria-label="Menu do painel">
      <div class="menu-topo">
        <div class="menu-marca">Emellyn <span>Cracco</span></div>
